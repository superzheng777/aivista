spring:
  application:
    name: aivista
  rabbitmq:
    host: ${AIVISTA_RABBITMQ_HOST:}
    port: ${AIVISTA_RABBITMQ_PORT:5672}
    username: ${AIVISTA_RABBITMQ_USERNAME:}
    password: ${AIVISTA_RABBITMQ_PASSWORD:}
    virtual-host: ${AIVISTA_RABBITMQ_VHOST:/aivista}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    url: ${AIVISTA_DB_URL:}
    username: ${AIVISTA_DB_USERNAME:}
    password: ${AIVISTA_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8888
  servlet:
    context-path: /api

app:
  meilisearch:
    enabled: ${MEILISEARCH_ENABLED:false}
    endpoint: ${MEILISEARCH_ENDPOINT:}
    search-key: ${MEILISEARCH_SEARCH_KEY:}
    admin-key: ${MEILISEARCH_ADMIN_KEY:}
    task-key: ${MEILISEARCH_TASK_KEY:}
    index-uid: public_images
    search-connect-timeout: 1s
    search-request-timeout: 2s
    index-connect-timeout: 2s
    index-request-timeout: 5s
    task-wait-timeout: 30s
    sync-batch-size: 100
    rebuild-on-startup: false
    trust-forwarded-for: false
  cors:
    # 多个来源以英文逗号分隔；生产环境请配置为实际前端域名。
    allowed-origins: ${AIVISTA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  auth:
    access-token-ttl: 15m
    refresh-token-ttl: 14d
    refresh-token-bytes: 32
    jwt:
      # 所有环境均由部署环境注入；未配置时启动校验失败。
      secret: ${AIVISTA_JWT_SECRET:}
    cookie:
      name: refresh_token
      path: /api/auth
      secure: ${AIVISTA_COOKIE_SECURE:false}
      same-site: Lax
    argon2:
      salt-length: 16
      hash-length: 32
      parallelism: 1
      memory: 16384
      iterations: 2
    session-cleanup:
      enabled: true
      retention: 7d
      batch-size: 500
      max-batches: 10
      fixed-delay-ms: 3600000
  idempotency:
    cleanup:
      enabled: true
      batch-size: 1000
      max-batches: 10
      fixed-delay: 10m
  outbox:
    cleanup:
      enabled: true
      retention: 7d
      batch-size: 1000
      max-batches: 10
      fixed-delay: 1h
  generation:
    worker-api:
      # Internal TS-to-Java calls are disabled until a non-empty shared token is configured.
      token: ${AIVISTA_GENERATION_WORKER_TOKEN:}
    sse:
      max-connections-per-user: 3
      max-connections: 1000
      heartbeat-interval: 15s
      dispatcher-fixed-delay: 1s
      dispatcher-batch-size: 100
      processing-lease: 30s
    queue:
      # 当前所有开发配置统一维护在本文件；未配置 RabbitMQ 时保持 false，避免启动分发器。
      enabled: true
      exchange: aivista.generation.commands
      generation-name: generation.task.execute
      generation-routing-key: generation.task.execute
      # 并发度由 backend-ts 从本配置读取；Java 不消费生成命令。
      generation-consumer-concurrency: 25
      dispatcher-fixed-delay: 1s
      dispatcher-batch-size: 20
      processing-lease: 30s
      delivery-max-attempts: 5
      delivery-retry-delay: 5s
      queue-timeout: 3m
      queue-timeout-fixed-delay: 30s
    bailian:
      endpoint: ${AIVISTA_BAILIAN_ENDPOINT:}
      api-key: ${AIVISTA_BAILIAN_API_KEY:}
      connect-timeout: 5s
      read-timeout: 330s
      max-concurrent-calls: 25
      rate-limit-per-second: 2
      max-retries: 3
    image-transfer:
      source-connect-timeout: 5s
      source-read-timeout: 30s
    oss:
      endpoint: ${AIVISTA_OSS_ENDPOINT:}
      bucket: ${AIVISTA_OSS_BUCKET:}
      access-key-id: ${AIVISTA_OSS_ACCESS_KEY_ID:}
      access-key-secret: ${AIVISTA_OSS_ACCESS_KEY_SECRET:}
      object-prefix: users
      signed-url-ttl: 10m
      upload-connect-timeout: 5s
      upload-read-timeout: 30s
    asset-cleanup:
      fixed-delay: 1m
      retry-delay: 10m
      batch-size: 100
    asset-upload:
      max-bytes: 10485760
      temporary-ttl: 24h
    task:
      model: bailian/qwen-image-2.0
      max-active-tasks-per-user: 4
      daily-image-quota: 12
      max-prompt-code-points: 1000
      max-negative-prompt-code-points: 500
      min-image-count: 1
      max-image-count: 6
      aspect-ratios:
        "[1:1]": "2048*2048"
        "[16:9]": "2688*1536"
        "[9:16]": "1536*2688"
        "[4:3]": "2368*1728"
        "[3:4]": "1728*2368"
    consent:
      policy-version: 2026-08-27-v3
      policy-content: |-
        第三方数据处理说明

        为向你提供文生图服务，AiVista 需要将本次生成所需的信息发送至阿里云百炼服务处理。请在提交生成任务前阅读并确认本说明。

        一、处理目的
        AiVista 使用阿里云百炼的图像生成能力，根据你本次提交的提示词生成图片。创作会话中的历史提示词仅用于向你展示生成记录，不会作为本次生成的模型输入。

        二、处理的信息
        本次生成可能发送你本次填写的正向提示词、负向提示词，以及图片数量、画面尺寸等生成参数。请不要在提示词中输入密码、身份证号、银行卡号、精确住址、联系方式、医疗健康信息或其他敏感个人信息。

        三、接收方与处理方式
        接收方为阿里云百炼服务。AiVista 后端通过接口将上述生成所需内容发送至阿里云百炼，由其完成图像生成。AiVista 不会向其提供你的登录密码、Refresh Token 或 Access Token。

        四、AiVista 的保存方式
        AiVista 会保存生成会话中的提示词、生成任务记录和生成结果图片，以便你后续查看生成记录。生成结果会保存到 AiVista 使用的私有对象存储中。你可以在个人资产页面删除成功生成的图片；删除后图片不再展示，对应私有对象将由后台异步清理。生成会话和任务记录仍会保留，用于展示生成历史。

        五、你的选择
        你可以选择不同意本说明，但将无法使用文生图功能。你可以在后续版本通过设置或联系渠道撤回同意；撤回不影响撤回前已经完成的处理活动，但会停止后续文生图请求。

        六、规则更新
        如果处理目的、处理方式、处理的信息类型或接收方发生变化，AiVista 会展示更新后的说明，并在你重新确认后继续提供文生图服务。

# springdoc-openapi：生成 OpenAPI 3 接口描述。
springdoc:
  # OpenAPI JSON 描述文件的访问路径：/api/v3/api-docs。
  api-docs:
    path: /v3/api-docs
  # Swagger UI 的访问路径：/api/swagger-ui.html（Knife4j 页面为 /api/doc.html）。
  swagger-ui:
    path: /swagger-ui.html
  # 接口分组。后续可按用户端、管理端等业务拆分为多个分组。
  group-configs:
    - group: default # 文档分组名称，会显示在 Knife4j 的分组列表中。
      packages-to-scan: com.superz.aivista # 扫描各业务模块的 api 包中的 Controller。

# Knife4j：OpenAPI 文档的增强 UI 配置。
knife4j:
  enable: true # 启用 Knife4j 增强功能与 /doc.html 页面。
  setting:
    language: zh_cn # Knife4j UI 使用简体中文。
